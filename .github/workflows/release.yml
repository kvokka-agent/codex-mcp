name: Release

on:
  push:
    branches: [main, master]
  # npm reads the workflow file out of the `workflow_ref` claim, which names the file
  # holding the job that started the run. Publishing a tag by hand therefore starts here
  # and not in `publish.yml`: a run started anywhere else sends a file name the trusted
  # publisher does not carry, and npm answers the publish with a 404.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, for example v2.3.0. Raises no version and moves no branch.
        type: string
        required: true

# One release at a time: a second merge waits for the first to finish rather than
# racing it for the branch tip. GitHub keeps at most one run waiting per group, so a
# third merge arriving while one waits cancels the waiting run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the commit the release would ship and parks it on a branch of its own.
  # The release branch does not move here.
  prepare:
    # A hand-started run names the tag it publishes and raises nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      # The tip of the release branch, not the merge commit that triggered the run: a
      # merge that landed while this run waited for the one before it is already on the
      # branch, and the version is raised from what the branch carries now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Read the release label of the pull request this merge came from
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          labels=$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[] | select(.merge_commit_sha == env.SHA) | .labels[].name]')
          echo "The pull request of $SHA carries: $labels"
          level=$(bun scripts/release.mjs level "$labels")
          if [ -z "$level" ]; then
            echo "No release:major, release:minor or release:patch label — this merge ships no release."
          else
            echo "Releasing a $level version."
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
      - name: Commit the new version onto a candidate branch
        id: candidate
        if: steps.level.outputs.level != ''
        env:
          LEVEL: ${{ steps.level.outputs.level }}
          # The run attempt is part of the name so a re-run pushes its own candidate
          # rather than a non-fast-forward update of the one the attempt before it left.
          BRANCH: release-candidate/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          base=$(git rev-parse HEAD)
          version=$(bun scripts/release.mjs bump "$LEVEL")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version files and CHANGELOG.md changed, and nothing else: the bump refuses
          # to run on a tree where a version file no longer carries the version, or where
          # the changelog carries no `## [Unreleased]` block to move.
          git commit -am "chore(release): v$version"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "base=$base"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

  # The full matrix, run once, against the candidate commit — the tree that ships.
  verify:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  promote:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # The push below asks git to prove the candidate descends from the release
          # branch, and git reads that proof out of the history between the two. The
          # default depth of 1 carries none of it, and the push is rejected as a
          # non-fast-forward however far ahead the candidate actually is.
          fetch-depth: 0
      # `scripts/release.mjs` names the plugin tag and `scripts/badges.mjs` writes the
      # badge documents; bun is what runs both. Neither reaches node_modules, so this job
      # installs nothing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # What `verify` measured over this very commit, carried here as job outputs. The
      # suite runs once per release, in `check`, and this job only writes down what it
      # answered. An output that never got set arrives as the empty string, which the
      # script refuses rather than writing over a badge.
      - name: Write the badges the checks measured
        env:
          FALLOW_BADGE: ${{ needs.verify.outputs.fallow-badge }}
          COVERAGE_BADGE: ${{ needs.verify.outputs.coverage-badge }}
        run: bun scripts/badges.mjs write "$FALLOW_BADGE" "$COVERAGE_BADGE"
      - name: Move the release branch to the verified commit and tag it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          CANDIDATE: ${{ needs.prepare.outputs.branch }}
        run: |
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH"
          tip=$(git rev-parse FETCH_HEAD)
          if [ "$tip" != "$BASE" ]; then
            echo "$RELEASE_BRANCH moved to $tip while the matrix ran, so v$VERSION was" \
                 "checked against a tree that is no longer what $RELEASE_BRANCH carries."
            echo "Nothing is tagged and nothing is published. Re-run this workflow: it" \
                 "builds a new candidate on $tip and checks that one."
            exit 1
          fi
          # Both tags name $SHA, the commit the matrix passed on. The badge commit below
          # is checked by nothing, so no tag may reach it.
          git tag "v$VERSION" "$SHA"
          # Claude Code resolves a plugin dependency's version range against
          # `{plugin-name}--v{version}` tags alone, so the release carries that tag beside
          # `v$VERSION` on the same commit.
          plugin_tag=$(bun scripts/release.mjs tag "$VERSION")
          git tag "$plugin_tag" "$SHA"
          # The branch goes one commit further than the tags where a badge moved: a child
          # of $SHA carrying the two documents, which keeps the push a fast-forward. Where
          # neither moved the branch stops at $SHA and the release writes no extra commit.
          # `[skip ci]` is read off the head commit of a push, which is this one, and it
          # is what keeps the push from starting a release run over a tree whose only
          # change is two generated documents.
          head="$SHA"
          if ! git diff --quiet -- docs/fallow-badge.json docs/coverage-badge.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): badges v$VERSION [skip ci]" \
              -- docs/fallow-badge.json docs/coverage-badge.json
            head=$(git rev-parse HEAD)
          fi
          # One push, every ref: GitHub honours --atomic, so a branch update it rejects
          # takes the tags down with it. The branch update is a plain fast-forward, which
          # is what rejects it when a commit reaches the branch between the check above
          # and this line.
          git push --atomic origin "$head:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/v$VERSION" "refs/tags/$plugin_tag"
          git push origin ":refs/heads/$CANDIDATE"

  # npm carries one @kvokka/codex-mcp and this repository is where it comes from. A
  # fork that merges a labelled pull request raises its own version and tags its own
  # copy; the run reaches this job and skips it.
  publish:
    needs: [prepare, promote]
    # `always()` is what lets a hand-started run reach this job over the three skipped
    # above it. A merge that cut no version leaves `promote` skipped, and a merge whose
    # matrix or promotion failed leaves it failed; neither publishes.
    if: >-
      always() && github.repository == 'kvokka/codex-mcp'
      && (github.event_name == 'workflow_dispatch' || needs.promote.result == 'success')
    # A called workflow's job is refused the permission its caller does not hold, and a
    # caller that names no `permissions` holds `id-token: none` — which is the one the
    # publish job needs for the npm OIDC token. GitHub rejects the whole file for it,
    # before any job starts. `tests/workflows.test.ts` compares the two sides.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ inputs.ref || format('v{0}', needs.prepare.outputs.version) }}
    secrets: inherit
