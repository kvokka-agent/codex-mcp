name: Publish

on:
  # The release run calls this after it has tagged the version. Dispatch it by hand on a
  # tag whose release run reached the tag but not the publish.
  workflow_call:
    inputs:
      ref:
        description: Tag to publish.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, for example v2.2.1.
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
