name: Publish

on:
  # `release.yml` is the only caller, both after a merge cut a tag and when someone
  # publishes a tag by hand. This file carries no trigger of its own: npm matches the
  # trusted publisher against the `workflow_ref` claim, which names the file the run
  # started in, so a run started here would send `publish.yml` where the release path
  # sends `release.yml` and only one of the two can be the configured name.
  workflow_call:
    inputs:
      ref:
        description: Tag to publish.
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
        env:
          # npm exchanges the GitHub OIDC token for a publish token of its own and says
          # nothing when the registry refuses the exchange: it publishes on with the empty
          # token `setup-node` wrote, and the registry answers the unauthenticated PUT
          # with a 404 that names neither the token nor the trusted publisher. At
          # `verbose` the reason the registry gave lands in the log instead.
          NPM_CONFIG_LOGLEVEL: verbose
          # Empty when the repository holds no such secret, which leaves the OIDC token
          # the only credential. A token in it publishes on its own, and npm still
          # prefers the OIDC one when the trusted publisher accepts the exchange.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
