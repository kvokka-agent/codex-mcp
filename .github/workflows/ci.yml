name: CI

on:
  # The release run calls this workflow to check the commit that carries the new
  # version, before the tag for it exists.
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Defaults to the commit that triggered the run.
        type: string
        required: false
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 18
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 18
          - os: macos-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Normalize git EOL settings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Launching the built server is the only thing that exercises the startup path:
      # STATE_DIR lock, session recovery, orphan reaping, and a stdout kept clean until
      # the MCP handshake. Neither script needs the codex binary — the server resolves it
      # lazily and falls back to exec mode when it is absent from PATH.
      - run: npm run check:stdio
      - run: npm run smoke:mcp

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # rumdl ships as a Rust binary; the npm package carries the prebuilt one and the
      # script pins its version, so the runner needs nothing beyond node.
      - run: npm run lint:md
