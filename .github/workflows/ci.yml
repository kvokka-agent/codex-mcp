name: CI

on:
  # The release run calls this workflow to check the commit that carries the new
  # version, before the tag for it exists.
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Defaults to the commit that triggered the run.
        type: string
        required: false
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # Every gate that answers the same on any host, run once.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run lint:md

  # What the published server does on the Node versions and the platforms it
  # claims. Launching the built bundle is the only thing that exercises the
  # startup path: STATE_DIR lock, session recovery, orphan reaping, and a stdout
  # kept clean until the MCP handshake. Neither script needs the codex binary —
  # the server resolves it lazily and falls back to exec mode when PATH carries
  # none.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 18
          - os: ubuntu-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 18
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 18
          - os: macos-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Normalize git EOL settings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # The bundle is built by bun and run by node: `node-version` is the version
      # under test, and the two scripts below spawn `node dist/index.js`.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:stdio
      - run: bun run smoke:mcp
