name: CI

on:
  # The release run calls this workflow to check the commit that carries the new
  # version, before the tag for it exists.
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Defaults to the commit that triggered the run.
        type: string
        required: false
    # The two README badges, measured by the run that checked the commit. The
    # release commits what it reads here rather than measuring again: measuring
    # means running the whole suite under coverage, which this run just did.
    outputs:
      fallow-badge:
        description: The shields.io endpoint document for the fallow health badge.
        value: ${{ jobs.check.outputs.fallow-badge }}
      coverage-badge:
        description: The shields.io endpoint document for the coverage badge.
        value: ${{ jobs.check.outputs.coverage-badge }}
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # Every gate that answers the same on any host, run once.
  check:
    runs-on: ubuntu-latest
    outputs:
      fallow-badge: ${{ steps.badges.outputs.fallow-badge }}
      coverage-badge: ${{ steps.badges.outputs.coverage-badge }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Ten points of the health score `bun run lint:fallow` prints are the
          # hotspot penalty, which fallow reads out of the commits of the last
          # six months. The default depth of 1 carries none of them, so a
          # shallow checkout scores this tree 95 where the full history scores
          # it 85 — and the badge step below would publish that 95.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # biome lints, formats and organizes imports in one pass, so this is the
      # whole style gate.
      - run: bun run lint
      - run: bun run typecheck
      # Before the tests: the end-to-end ones spawn the bundle, and a build
      # inside a test spends that test's own window on it.
      - run: bun run build
      # Runs the tests once, with coverage, and hands that coverage to fallow,
      # which needs it for exact CRAP scores.
      - run: bun run lint:fallow
      # Both badges, out of the coverage `lint:fallow` just wrote and the health
      # score fallow read from it — the same measurement, no second suite. The
      # documents go to stdout as `$GITHUB_OUTPUT` lines and what changed on
      # disk to stderr, and `promote` of release.yml is what commits them.
      - id: badges
        run: bun run badge >> "$GITHUB_OUTPUT"
      - run: bun run lint:md

  # What the published server does on the bun versions and the platforms it
  # claims. Launching the built bundle is the only thing that exercises the
  # startup path: STATE_DIR lock, session recovery, orphan reaping, and a stdout
  # kept clean until the MCP handshake. Neither script needs the codex binary —
  # the server resolves it lazily and neither script starts a session.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # `1.4.0` is the floor `engines.bun` names; `latest` is what a fresh
        # `bunx` run installs for.
        bun-version: ["1.4.0", latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Normalize git EOL settings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:stdio
      - run: bun run smoke:mcp
