repos:
  - repo: local
    hooks:
      # `--write` so the commit carries the formatted, import-sorted file rather
      # than a report of what it should have been. `--no-errors-on-unmatched`
      # keeps a commit touching only paths biome.json ignores from failing here.
      - id: biome
        name: biome
        entry: bunx biome check --write --no-errors-on-unmatched
        language: system
        files: \.(ts|mjs|js|jsonc?)$
      # The whole quality gate, and the reason a commit takes half a minute: the
      # CRAP thresholds of `.fallowrc.jsonc` are only as true as the coverage
      # report behind them, so the suite runs first and fallow reads what it
      # measured. Each fallow analysis is called by name — the combined `fallow`
      # run exits 0 in every machine-readable format, so a gate built on it
      # passes whatever it found.
      - id: fallow
        name: fallow
        entry: bun run lint:fallow
        language: system
        pass_filenames: false
        files: \.(ts|mjs|js|jsonc?)$
      - id: rumdl
        name: rumdl
        entry: bunx rumdl check
        language: system
        files: \.md$
